name: Render Video
on:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Render Remotion Video
        run: npx remotion render GymCinematic public/sport-gym-showcase.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-video
          path: public/sport-gym-showcase.mp4
